<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Language Translator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="light-mode">
    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="logo">
                <i class="fa-solid fa-language"></i>
                <div>
                    <h1>AI Language Translator</h1>
                    <p>Powered by Advanced Deep Translation</p>
                </div>
            </div>
            <button id="theme-toggle" aria-label="Toggle Dark Mode">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Main Workspace -->
        <main class="translator-workspace">
            
            <!-- Controls: Source -> Target -->
            <div class="language-controls">
                <div class="lang-selector-group">
                    <label for="source-lang">Translate from</label>
                    <select id="source-lang">
                        <option value="auto">Auto Detect</option>
                        <option value="en" selected>English</option>
                        <option value="te">Telugu</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>

                <button id="swap-btn" class="icon-btn" title="Swap Languages">
                    <i class="fa-solid fa-right-left"></i>
                </button>

                <div class="lang-selector-group">
                    <label for="target-lang">Translate to</label>
                    <select id="target-lang">
                        <option value="en">English</option>
                        <option value="te" selected>Telugu</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="es">Spanish</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="ja">Japanese</option>
                    </select>
                </div>
            </div>

            <!-- Translation Area -->
            <div class="translation-panels">
                
                <!-- Source Panel -->
                <div class="panel source-panel">
                    <textarea id="source-text" placeholder="Enter text to translate..."></textarea>
                    <div class="panel-footer">
                        <div class="char-count">
                            <span id="char-count-value">0</span> / 5000
                        </div>
                        <div class="panel-actions">
                            <button id="clear-btn" class="text-btn" title="Clear text"><i class="fa-solid fa-trash-can"></i></button>
                            <button id="tts-source-btn" class="text-btn" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
                        </div>
                    </div>
                </div>

                <!-- Target Panel -->
                <div class="panel target-panel">
                    <!-- Loading overlay -->
                    <div id="loading-overlay" class="hidden">
                        <div class="spinner"></div>
                        <span>Translating...</span>
                    </div>
                    
                    <textarea id="target-text" placeholder="Translation will appear here..." readonly></textarea>
                    <div class="panel-footer">
                        <div class="status-msg" id="status-msg"></div>
                        <div class="panel-actions">
                            <button id="copy-btn" class="text-btn" title="Copy translation"><i class="fa-regular fa-copy"></i></button>
                            <button id="tts-target-btn" class="text-btn" title="Listen"><i class="fa-solid fa-volume-high"></i></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Main Translate Button -->
            <div class="action-row">
                <button id="translate-btn" class="primary-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Translate
                </button>
            </div>
            
            <div id="error-message" class="error-toast hidden"></div>
        </main>

        <!-- History Section -->
        <section class="history-section">
            <div class="history-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> Translation History</h2>
                <button id="clear-history-btn" class="secondary-btn">Clear History</button>
            </div>
            <div id="history-container" class="history-list">
                <!-- History items will be injected here -->
            </div>
        </section>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
